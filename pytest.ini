[pytest]
# Pytest configuration for EHR-NLP ML System Tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Custom markers
markers =
    unit: Fast unit tests (no external dependencies)
    integration: Integration tests (may require database/network)
    slow: Slow tests requiring ML model loading (deselect with -m "not slow")
    version_a: Tests for Version A (Regex) extractor
    version_b: Tests for Version B (GatorTron/MTL) extractor
    version_c: Tests for Version C (Two-Tier) extractor
    version_d: Tests for Version D (Ensemble) extractor
    api: API route tests
    database: Tests requiring database connection

# Timeout for long-running tests (requires pytest-timeout plugin)
# timeout = 300

# Coverage settings (requires pytest-cov plugin)
# addopts = --cov=backend --cov-report=html --cov-report=term-missing

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum pytest version
minversion = 7.0

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test.log
log_file_level = DEBUG

# Async mode (if using pytest-asyncio)
# asyncio_mode = auto
