<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EHR-NLP System</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <!-- Pico CSS (Custom Theme) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <nav class="container-fluid">
        <ul>
            <li><strong>EHR-NLP</strong></li>
        </ul>
        <ul>
            <li><a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">Dashboard</a></li>
            <li><a href="/patients" hx-get="/patients" hx-target="#main-content" hx-push-url="true">Patients</a></li>
            <li><a href="/medical-note" hx-get="/medical-note" hx-target="#main-content" hx-push-url="true">Medical
                    Note</a></li>
            <li><a href="/reports" hx-get="/reports" hx-target="#main-content" hx-push-url="true">Reports</a></li>
        </ul>
    </nav>
    <main class="container" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- App Bundle -->
    {% if config.USE_VITE %}
    <script type="module" src="http://localhost:5173/@vite/client"></script>
    <script type="module" src="http://localhost:5173/index.tsx"></script>
    {% else %}
    <script src="{{ url_for('static', filename='dist/vendors.bundle.js') }}"></script>
    <script src="{{ url_for('static', filename='dist/main.bundle.js') }}"></script>
    {% endif %}

    <script>
        // Persist visit_id across navigation
        document.body.addEventListener('htmx:configRequest', function (evt) {
            const visitId = new URLSearchParams(window.location.search).get('visit_id');
            // Only add if not already present in the path
            if (visitId && !evt.detail.path.includes('visit_id=')) {
                evt.detail.parameters['visit_id'] = visitId;
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
