<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EHR-NLP System</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <!-- Pico CSS (Custom Theme) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <nav class="container-fluid">
        <ul>
            <li><strong>EHR-NLP</strong></li>
        </ul>
        <ul>
            <li><a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">Dashboard</a></li>
            <li><a href="/patients" hx-get="/patients" hx-target="#main-content" hx-push-url="true">Patients</a></li>
            <li><a href="/medical-note" hx-get="/medical-note" hx-target="#main-content" hx-push-url="true">Medical
                    Note</a></li>
            <li><a href="/reports" hx-get="/reports" hx-target="#main-content" hx-push-url="true">Reports</a></li>
        </ul>
    </nav>
    <main class="container" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container" x-data="toastManager()">
        <template x-for="toast in toasts" :key="toast.id">
            <div :class="'alert alert-' + toast.type + (toast.exiting ? ' alert-exit' : '')"
                 x-show="toast.visible"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:leave="transition ease-in duration-200">
                <span class="alert-icon" x-html="getIcon(toast.type)"></span>
                <span x-text="toast.message"></span>
                <button class="alert-close" @click="removeToast(toast.id)" aria-label="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </template>
    </div>

    <!-- App Bundle -->
    {% if config.USE_VITE %}
    <script type="module" src="http://localhost:5173/@vite/client"></script>
    <script type="module" src="http://localhost:5173/frontend/src/index.ts"></script>
    {% else %}
    <script type="module" src="{{ url_for('static', filename='dist/index.js') }}"></script>
    {% endif %}

    <script>
        // Persist visit_id across navigation
        document.body.addEventListener('htmx:configRequest', function (evt) {
            const visitId = new URLSearchParams(window.location.search).get('visit_id');
            // Only add if not already present in the path
            if (visitId && !evt.detail.path.includes('visit_id=')) {
                evt.detail.parameters['visit_id'] = visitId;
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // Toast Manager Alpine.js Component
        document.addEventListener('alpine:init', () => {
            Alpine.data('toastManager', () => ({
                toasts: [],
                nextId: 0,

                addToast(message, type = 'info', duration = 3000) {
                    const id = this.nextId++;
                    this.toasts.push({ id, message, type, visible: true, exiting: false });

                    if (duration > 0) {
                        setTimeout(() => this.removeToast(id), duration);
                    }
                    return id;
                },

                removeToast(id) {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) {
                        toast.exiting = true;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 200);
                    }
                },

                getIcon(type) {
                    const icons = {
                        success: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                        error: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                        warning: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                        info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
                    };
                    return icons[type] || icons.info;
                }
            }));
        });

        // Global toast function for easy access
        window.showToast = function(message, type = 'info', duration = 3000) {
            const toastContainer = document.getElementById('toast-container');
            if (toastContainer && toastContainer._x_dataStack) {
                toastContainer._x_dataStack[0].addToast(message, type, duration);
            }
        };
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
