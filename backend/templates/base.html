<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EHR-NLP System</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <!-- Pico CSS (Custom Theme) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <!-- HTMX (14KB) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js (15KB) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Konva.js (Core) -->
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <nav class="container-fluid">
        <ul>
            <li><strong>EHR-NLP</strong></li>
        </ul>
        <ul>
            <li><a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">Dashboard</a></li>
            <li><a href="/patients" hx-get="/patients" hx-target="#main-content" hx-push-url="true">Patients</a></li>
            <li><a href="/medical-note" hx-get="/medical-note" hx-target="#main-content" hx-push-url="true">Medical
                    Note</a></li>
            <li><a href="/joint-assessment" hx-get="/joint-assessment" hx-target="#main-content"
                    hx-push-url="true">Joints</a></li>
            <li><a href="/reports" hx-get="/reports" hx-target="#main-content" hx-push-url="true">Reports</a></li>
        </ul>
    </nav>
    <main class="container" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>

    <!-- App Logic Scripts (Loaded globally to support HTMX/Alpine) -->
    <script src="{{ url_for('static', filename='js/joint_diagram.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/joint_assessment_logic.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/voice_recorder.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/medical_note_logic.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/patients_logic.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/reports_logic.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/dashboard_logic.js') }}?v=2"></script>

    <script>
        // Persist visit_id across navigation
        document.body.addEventListener('htmx:configRequest', function (evt) {
            const visitId = new URLSearchParams(window.location.search).get('visit_id');
            // Only add if not already present in the path
            if (visitId && !evt.detail.path.includes('visit_id=')) {
                evt.detail.parameters['visit_id'] = visitId;
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/serviceworker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
