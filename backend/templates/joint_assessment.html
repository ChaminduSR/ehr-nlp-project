{% extends layout %}

{% block content %}
<div x-data="jointAssessment()" x-init="init()">
  <nav aria-label="breadcrumb">
    <ul>
      <li><a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">Dashboard</a></li>
      <li>Joint Assessment</li>
    </ul>
  </nav>

  <h1>Joint Assessment (DAS28)</h1>

  <div class="grid">
    <!-- Left Column: Joint Map -->
    <article>
      <header>Joint Map</header>
      <div id="joint-canvas" style="background: #f0f0f0; border: 1px solid #ccc; position: relative;"></div>

      <!-- Legend -->
      <footer class="grid">
        <div><span style="display:inline-block;width:12px;height:12px;background:white;border:1px solid #333;"></span>
          Normal</div>
        <div><span style="display:inline-block;width:12px;height:12px;background:#FFEB3B;border:1px solid #333;"></span>
          Tenderness</div>
        <div><span style="display:inline-block;width:12px;height:12px;background:#FF4444;border:1px solid #333;"></span>
          Swelling</div>
        <div><span style="display:inline-block;width:12px;height:12px;background:#FF8C00;border:1px solid #333;"></span>
          Both</div>
        <div><span
            style="display:inline-block;width:12px;height:12px;background:white;border:2px solid #2196F3;"></span> Pain
          (Right Click)</div>
      </footer>
    </article>

    <!-- Right Column: DAS28 Score & Controls -->
    <article>
      <header>DAS28 Score</header>
      <div class="grid">
        <div>
          <label>Tender Joints (TJC)</label>
          <input type="number" x-model="tjc" readonly>
        </div>
        <div>
          <label>Swollen Joints (SJC)</label>
          <input type="number" x-model="sjc" readonly>
        </div>
        <div>
          <label>ESR (mm/h)</label>
          <input type="number" x-model="esr" @input="calculateDAS28()">
        </div>
        <div>
          <label>Patient Global (0-100)</label>
          <input type="number" x-model="pga" @input="calculateDAS28()">
        </div>
      </div>
      <hr>
      <h3>Score: <span x-text="score"></span></h3>
      <progress :value="score" max="10"></progress>
      <p>
        <small x-show="score < 2.6">Remission</small>
        <small x-show="score >= 2.6 && score <= 3.2">Low Activity</small>
        <small x-show="score > 3.2 && score <= 5.1">Moderate Activity</small>
        <small x-show="score > 5.1">High Activity</small>
      </p>

      <button class="contrast" @click="saveAssessment()">Save Assessment</button>
    </article>
  </div>

  <!-- CSS Tooltip -->
  <div id="joint-tooltip" class="joint-tooltip" x-show="hoveredJoint" :style="`left: ${tooltipX}px; top: ${tooltipY}px`"
    x-cloak>
    <span x-text="hoveredJoint?.label"></span>
  </div>
</div>

{% endblock %}

{% block scripts %}
{% endblock %}
