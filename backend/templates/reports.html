{% extends layout %}

{% block content %}
<div class="container" x-data="reportsLogic" x-init="init()">

  <h1>Reports</h1>

  <!-- Report Builder Form -->
  <article>
    <header><strong>Generate Report</strong></header>

    <div class="grid">
      <label>
        Report Type
        <select x-model="reportType" @change="updateForm()">
          <option value="summary">Patient Summary</option>
          <option value="trend">DAS28 Trend Report</option>
          <option value="performance">Clinic Performance</option>
          <option value="treatment">Treatment Response Cohort</option>
        </select>
      </label>
    </div>

    <!-- Patient Selection (for summary) -->
    <div x-show="reportType === 'summary'">
      <label>
        Patient
        <input type="text" @input.debounce.800ms="searchPatients($event)" placeholder="Search by name or MRN..."
          autocomplete="off">
      </label>
      <ul x-show="patientResults.length > 0"
        style="list-style: none; padding: 10px; background: #f9f9f9; margin-top: 5px; border: 1px solid #ddd;">
        <template x-for="patient in patientResults" :key="patient.id">
          <li @click="selectPatient(patient); patientResults = []"
            style="padding: 8px; cursor: pointer; border-bottom: 1px solid #eee;">
            <strong x-text="patient.name"></strong> · MRN: <span x-text="patient.mrn"></span>
          </li>
        </template>
      </ul>
      <p x-show="selectedPatient" style="margin-top: 10px; color: var(--ins-color);">
        ✓ Selected: <strong x-text="selectedPatient?.name"></strong>
      </p>
    </div>

    <!-- Date Range (for trend & performance) -->
    <div class="grid" x-show="['trend', 'performance', 'treatment'].includes(reportType)">
      <label>
        Start Date
        <input type="date" x-model="filters.startDate">
      </label>
      <label>
        End Date
        <input type="date" x-model="filters.endDate">
      </label>
    </div>

    <!-- Generate Button -->
    <button @click="generateReport()" :disabled="isGenerating">
      <span x-show="!isGenerating">Generate Report</span>
      <span x-show="isGenerating">⏳ Generating...</span>
    </button>
  </article>

  <!-- Report Preview (loaded dynamically) -->
  <div id="report-preview" x-show="showPreview">
    <div hx-get="/api/v1/reports/preview" hx-trigger="manual" hx-swap="innerHTML" hx-target="this">
    </div>
  </div>

</div>

{% endblock %}
