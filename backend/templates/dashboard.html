{% extends layout %}

{% block content %}
<div class="container" x-data="dashboardData" x-init="init()">

  <!-- Header -->
  <div class="grid">
    <div>
      <h1>Clinic Dashboard</h1>
      <p x-text="'Last updated: ' + new Date().toLocaleTimeString()"></p>
    </div>
  </div>

  <!-- KPI Stats (Modern glass cards) -->
  <div class="stats">
    <article class="stat glass glass-hover">
      <div class="stat-title">Patients Today</div>
      <div class="stat-value" x-text="stats.patientsToday">
        <template x-if="loading">
          <span class="skeleton" style="width: 3rem; height: 2.25rem; display: inline-block;"></span>
        </template>
        <span x-show="!loading" x-text="stats.patientsToday">0</span>
      </div>
      <div class="stat-desc" x-show="stats.patientsTodayChange">
        <span :class="stats.patientsTodayChange > 0 ? 'stat-desc-success' : 'stat-desc-error'"
              x-text="(stats.patientsTodayChange > 0 ? '↑ ' : '↓ ') + Math.abs(stats.patientsTodayChange) + ' from yesterday'"></span>
      </div>
    </article>

    <article class="stat glass glass-hover">
      <div class="stat-title">Avg DAS28</div>
      <div class="stat-value">
        <template x-if="loading">
          <span class="skeleton" style="width: 3rem; height: 2.25rem; display: inline-block;"></span>
        </template>
        <span x-show="!loading" x-text="(stats.avgDAS28).toFixed(1)">0.0</span>
      </div>
      <div class="stat-desc">
        <span class="badge-modern"
              :class="stats.avgDAS28 < 2.6 ? 'badge-success' : (stats.avgDAS28 < 3.2 ? 'badge-warning' : 'badge-error')"
              x-text="stats.avgDAS28 < 2.6 ? 'Remission' : (stats.avgDAS28 < 3.2 ? 'Low' : 'Active')"></span>
      </div>
    </article>

    <article class="stat glass glass-hover">
      <div class="stat-title">In Remission</div>
      <div class="stat-value text-success">
        <template x-if="loading">
          <span class="skeleton" style="width: 3rem; height: 2.25rem; display: inline-block;"></span>
        </template>
        <span x-show="!loading" x-text="stats.remissionPercent + '%'">0%</span>
      </div>
      <div class="stat-desc stat-desc-success" x-text="'Target: 50%'"></div>
    </article>

    <article class="stat glass glass-hover">
      <div class="stat-title">Pending Reviews</div>
      <div class="stat-value" :class="stats.pendingReviews > 5 ? 'text-warning' : ''">
        <template x-if="loading">
          <span class="skeleton" style="width: 3rem; height: 2.25rem; display: inline-block;"></span>
        </template>
        <span x-show="!loading" x-text="stats.pendingReviews">0</span>
      </div>
      <div class="stat-desc" x-show="stats.pendingReviews > 0">
        <span class="badge-modern badge-warning" x-text="'Needs attention'"></span>
      </div>
    </article>
  </div>

  <!-- Charts Section (Lazy-loaded) -->
  <div class="grid">

    <!-- Distribution Chart -->
    <article>
      <header>Disease Activity Distribution</header>
      <button @click="loadChart('distribution')" class="secondary outline" x-show="!charts.distribution">
        📊 Load Chart
      </button>
      <div id="chart-distribution" style="height: 350px; width: 100%;" x-show="charts.distribution"></div>
    </article>

    <!-- Trend Chart -->
    <article>
      <header>DAS28 Trend (Last 30 Days)</header>
      <button @click="loadChart('trend')" class="secondary outline" x-show="!charts.trend">
        📈 Load Chart
      </button>
      <div id="chart-trend" style="height: 350px; width: 100%;" x-show="charts.trend"></div>
    </article>
  </div>

  <!-- Recent Visits Table -->
  <article>
    <header><strong>Recent Visits</strong></header>
    <div hx-get="/api/dashboard/recent-visits" hx-trigger="load" hx-swap="innerHTML" hx-target="this">
      <div aria-busy="true">Loading visits...</div>
    </div>
  </article>

</div>

{% endblock %}
