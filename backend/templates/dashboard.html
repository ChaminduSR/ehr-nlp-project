{% extends layout %}

{% block content %}
<div class="container" x-data="dashboardData" x-init="init()">

  <!-- Header -->
  <div class="grid">
    <div>
      <h1>Clinic Dashboard</h1>
      <p x-text="'Last updated: ' + new Date().toLocaleTimeString()"></p>
    </div>
  </div>

  <!-- KPI Stats (Always visible) -->
  <div class="grid">
    <article class="kpi-card">
      <h3>Patients Today</h3>
      <div class="value" x-text="stats.patientsToday">0</div>
    </article>

    <article class="kpi-card">
      <h3>Avg DAS28</h3>
      <div class="value" x-text="(stats.avgDAS28).toFixed(1)">0.0</div>
    </article>

    <article class="kpi-card">
      <h3>In Remission</h3>
      <div class="value" x-text="stats.remissionPercent + '%'">0%</div>
    </article>

    <article class="kpi-card">
      <h3>Pending Reviews</h3>
      <div class="value" x-text="stats.pendingReviews">0</div>
    </article>
  </div>

  <!-- Charts Section (Lazy-loaded) -->
  <div class="grid">

    <!-- Distribution Chart -->
    <article>
      <header>Disease Activity Distribution</header>
      <button @click="loadChart('distribution')" class="secondary outline" x-show="!charts.distribution">
        📊 Load Chart
      </button>
      <div id="chart-distribution" style="height: 350px; width: 100%;" x-show="charts.distribution"></div>
    </article>

    <!-- Trend Chart -->
    <article>
      <header>DAS28 Trend (Last 30 Days)</header>
      <button @click="loadChart('trend')" class="secondary outline" x-show="!charts.trend">
        📈 Load Chart
      </button>
      <div id="chart-trend" style="height: 350px; width: 100%;" x-show="charts.trend"></div>
    </article>
  </div>

  <!-- Recent Visits Table -->
  <article>
    <header><strong>Recent Visits</strong></header>
    <div hx-get="/api/dashboard/recent-visits" hx-trigger="load" hx-swap="innerHTML" hx-target="this">
      <div aria-busy="true">Loading visits...</div>
    </div>
  </article>

  <!-- Patient List (Alpine) -->
  <article x-data="patientsManager()" x-init="init()">
    <header>
      <div class="grid">
        <div><strong>Patients</strong></div>
        <div style="text-align: right;">
          <input type="search" x-model="searchQuery" @input="filterPatients()" placeholder="Search patients..." style="display: inline-block; width: auto; margin: 0;">
        </div>
      </div>
    </header>

    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;">
      <template x-for="patient in filteredPatients" :key="patient.id">
        <div class="card" style="padding: 1rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius);">
          <div style="font-weight: bold;" x-text="patient.last_name + ', ' + patient.first_name"></div>
          <div class="small muted" x-text="'MRN: ' + patient.mrn"></div>
          <div class="small muted" x-text="'DOB: ' + patient.date_of_birth"></div>
          <template x-if="patient.latest_visit_id">
            <span class="badge" style="background: var(--pico-ins-color); color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-top: 0.5rem; display: inline-block;">Active</span>
          </template>
          <div style="margin-top: 0.75rem;">
            <button class="outline secondary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" @click="openEditModal(patient)">Edit</button>
            <button class="outline" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;" @click="createNewVisit(patient.id)">New Visit</button>
          </div>
        </div>
      </template>
    </div>

    <template x-if="filteredPatients.length === 0">
      <p class="muted" style="text-align: center; padding: 2rem;">No patients found.</p>
    </template>

    <!-- Add/Edit Patient Modal -->
    <dialog :open="isModalOpen" @click.self="closeModal()">
      <article>
        <header>
          <button aria-label="Close" rel="prev" @click="closeModal()"></button>
          <p><strong x-text="isEditMode ? 'Edit Patient' : 'Add Patient'"></strong></p>
        </header>
        <form @submit.prevent="savePatient()">
          <label>MRN
            <input type="text" x-model="form.mrn" required>
          </label>
          <label>First Name
            <input type="text" x-model="form.first_name" required>
          </label>
          <label>Last Name
            <input type="text" x-model="form.last_name" required>
          </label>
          <label>Date of Birth
            <input type="date" x-model="form.date_of_birth" required>
          </label>
          <footer>
            <button type="button" class="secondary" @click="closeModal()">Cancel</button>
            <button type="submit" x-text="isEditMode ? 'Update' : 'Create'">Save</button>
          </footer>
        </form>
      </article>
    </dialog>
  </article>

</div>

{% endblock %}
