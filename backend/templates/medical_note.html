{% extends layout %}

{% block content %}
<div x-data="medicalNote()">
  <nav aria-label="breadcrumb">
    <ul>
      <li><a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true">Dashboard</a></li>
      <li>Medical Note</li>
    </ul>
  </nav>

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Medical Note</h1>
    <span x-text="saveStatus" style="color: var(--pico-muted-color); font-size: 0.9rem; font-weight: bold;"></span>
  </div>

  <!-- Error Banner -->
  <div x-show="error" class="p-4 mb-4 text-red-700 bg-red-100 rounded-lg" role="alert" style="display: none;">
    <span x-text="error"></span>
  </div>

  <div class="medical-note-wrapper">
    <!-- Load the medical note fragment (contains Smart Detection, Structured Note, Joint Map tabs) -->
    <div id="structured-report" hx-get="/api/v1/medical_notes/fragment?visit_id={{ request.args.get('visit_id', '') }}"
      hx-trigger="load, refreshReport from:body">
      <div aria-busy="true">Loading medical note editor...</div>
    </div>
  </div>
  <!-- Save indicator now uses toast system - hidden legacy indicator -->
  <div id="global-save-indicator" aria-live="polite" style="display: none;">Ready</div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    // Track last state to avoid duplicate toasts
    let lastState = 'ready';
    let saveToastId = null;

    function setState(state, detail) {
      if (state === lastState) return;
      lastState = state;

      if (state === 'saving') {
        // Show persistent saving toast
        if (window.showToast) {
          saveToastId = window.showToast('Saving changes...', 'info', 0); // 0 = no auto-dismiss
        }
      } else if (state === 'saved') {
        // Remove saving toast and show success
        if (window.showToast) {
          window.showToast('Changes saved successfully', 'success', 2500);
        }
        setTimeout(() => { lastState = 'ready'; }, 2600);
      } else if (state === 'error') {
        if (window.showToast) {
          window.showToast('Failed to save changes', 'error', 5000);
        }
      }
    }

    window.addEventListener('coordinatedSaveStart', () => setState('saving'));
    window.addEventListener('coordinatedSaveEnd', (e) => {
      const ok = e && e.detail && e.detail.success;
      setState(ok ? 'saved' : 'error', e && e.detail);
    });

    // Also reflect local fragment save-status changes
    function attachFragObserver(node) {
      if (!node) return null;
      try {
        const obs = new MutationObserver(() => {
          const txt = node.textContent || '';
          if (txt.toLowerCase().includes('saving')) setState('saving');
          else if (txt.toLowerCase().includes('saved')) setState('saved');
          else if (txt.toLowerCase().includes('error')) setState('error');
        });
        obs.observe(node, { characterData: true, childList: true, subtree: true });
        return obs;
      } catch (e) {
        return null;
      }
    }

    let fragObserver = null;
    const existingFrag = document.getElementById('save-status');
    if (existingFrag) fragObserver = attachFragObserver(existingFrag);

    // If fragment isn't loaded yet, watch for it being added to the DOM and then attach
    if (!fragObserver) {
      const bodyObserver = new MutationObserver((mutations, obs) => {
        for (const m of mutations) {
          for (const node of (m.addedNodes || [])) {
            if (node && node.querySelector) {
              const found = node.querySelector('#save-status');
              if (found) {
                attachFragObserver(found);
                obs.disconnect();
                return;
              }
            }
          }
        }
      });
      bodyObserver.observe(document.body, { childList: true, subtree: true });
    }
  })();
</script>
{% endblock %}
