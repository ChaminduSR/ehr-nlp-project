<div class="joint-map-fragment" x-data="jointAssessment()" x-init="init()">
    <div class="panel-header">
        <h3>Joint Assessment</h3>
        <span class="save-status" x-text="saveStatus"></span>
    </div>

    <div class="grid" style="grid-template-columns: 480px 1fr; gap: 1rem; align-items: start;">
        <!-- Left Column: Joint Map -->
        <article class="joint-card" style="padding: 1rem; margin: 0;">
            <header style="margin-bottom: 1rem;">Joint Map</header>
            <div id="joint-canvas" class="joint-map-canvas"
                style="width: 100%; height: 600px; background: #f8fafc; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); overflow: hidden; box-sizing: border-box;">
            </div>

            <!-- Legend -->
            <footer style="display: flex; flex-wrap: wrap; gap: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--pico-muted-border-color);">
                <span class="badge-modern badge-neutral">
                    <span style="width:10px;height:10px;background:white;border:1px solid #64748b;border-radius:2px;"></span>
                    Normal
                </span>
                <span class="badge-modern" style="background:#fef9c3;color:#854d0e;">
                    <span style="width:10px;height:10px;background:#FFEB3B;border:1px solid #854d0e;border-radius:2px;"></span>
                    Tender
                </span>
                <span class="badge-modern badge-error">
                    <span style="width:10px;height:10px;background:#FF4444;border:1px solid #991b1b;border-radius:2px;"></span>
                    Swollen
                </span>
                <span class="badge-modern" style="background:#ffedd5;color:#9a3412;">
                    <span style="width:10px;height:10px;background:#FF8C00;border:1px solid #9a3412;border-radius:2px;"></span>
                    Both
                </span>
                <span class="badge-modern badge-info">
                    <span style="width:10px;height:10px;background:white;border:2px solid #2196F3;border-radius:2px;"></span>
                    Pain
                </span>
            </footer>
        </article>

        <!-- Right Column: DAS28 Score & Controls -->
        <article style="padding: 1rem; margin: 0;">
            <header style="margin-bottom: 1rem;">DAS28 Score</header>
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label>Tender Joints (TJC)</label>
                    <input type="number" x-model="tjc" readonly>
                </div>
                <div>
                    <label>Swollen Joints (SJC)</label>
                    <input type="number" x-model="sjc" readonly>
                </div>
                <div>
                    <label>ESR (mm/h)</label>
                    <input type="number" x-model.number="esr" @input="calculateDAS28()">
                </div>
                <div>
                    <label>Patient Global (VAS 1-10)</label>
                    <div class="vas-scale" role="radiogroup" aria-label="Patient Global VAS"
                        style="display:flex; gap:0.25rem; flex-wrap:wrap;">
                        <template x-for="n in Array.from({length:10}, (_,i)=>i+1)" :key="n">
                            <button type="button" class="vas-button"
                                :class="{ 'vas-button--selected': $data.pg_scale === n }"
                                :aria-checked="$data.pg_scale === n" :data-value="n"
                                @click="pg_scale = n; calculateDAS28(); try{ if(window._markDirty) window._markDirty(); }catch(e){}">
                                <span x-text="n"></span>
                            </button>
                        </template>
                        <input type="hidden" name="pg_scale" x-model.number="$data.pg_scale">
                    </div>
                </div>
            </div>

            <hr style="margin: 1.5rem 0;">

            <div class="das28-card glass" style="padding: 1.5rem; text-align: center;">
                <h3 style="margin-bottom: 0.5rem;">DAS28-ESR Score</h3>
                <div style="font-size: 3rem; font-weight: 800; line-height: 1;" x-text="score"
                    :class="{
                        'text-success': score < 2.6,
                        'text-warning': score >= 2.6 && score <= 3.2,
                        'text-error': score > 3.2
                    }"></div>
                <progress :value="score" max="10" style="margin: 1rem 0 0.75rem 0;"></progress>
                <div style="margin-top: 0.5rem;">
                    <span x-show="score < 2.6" class="badge-modern badge-lg badge-success">
                        <span class="badge-dot"></span> Remission
                    </span>
                    <span x-show="score >= 2.6 && score <= 3.2" class="badge-modern badge-lg badge-warning">
                        <span class="badge-dot"></span> Low Activity
                    </span>
                    <span x-show="score > 3.2 && score <= 5.1" class="badge-modern badge-lg badge-info">
                        <span class="badge-dot"></span> Moderate Activity
                    </span>
                    <span x-show="score > 5.1" class="badge-modern badge-lg badge-error">
                        <span class="badge-dot"></span> High Activity
                    </span>
                </div>
            </div>

            <button class="contrast" @click="saveAssessment()" style="width: 100%; margin-top: 1rem;">Save
                Assessment</button>
        </article>
    </div>

    <div id="joint-tooltip" class="joint-tooltip" x-show="hoveredJoint"
        :style="`left: ${tooltipX}px; top: ${tooltipY}px; position: fixed; z-index: 1000; background: white; color: black; padding: 5px; border: 1px solid black; pointer-events: none;`"
        x-cloak>
        <span x-text="hoveredJoint && hoveredJoint.label"></span>
    </div>
</div>

<script>
    // Expose joint state getter so coordinated save can include joint data.
    (function () {
        // Wait for Alpine to initialize the fragment
        function getJointData() {
            try {
                const root = document.querySelector('.joint-map-fragment');
                if (!root) return null;
                const alpine = root.__x || root._x_dataStack && root._x_dataStack[0];
                const data = alpine && (alpine.$data || alpine);
                if (!data) return null;
                // Return a shallow copy of joints
                return JSON.parse(JSON.stringify(data.joints || {}));
            } catch (e) {
                console.warn('getJointData failed', e);
                return null;
            }
        }

        window.getJointData = getJointData;
    })();

    // Delegated keyboard handling for the VAS button grid.
    (function () {
        // Run after HTMX/Alpine have swapped the fragment into the DOM
        document.addEventListener('htmx:afterSwap', function (evt) {
            try {
                var root = evt.detail.target && evt.detail.target.querySelector && evt.detail.target.querySelector('.joint-map-fragment') || document.querySelector('.joint-map-fragment');
                if (!root) return;
                var container = root.querySelector('.vas-scale');
                if (!container || container._vasDelegated) return;
                container._vasDelegated = true;
                container.addEventListener('keydown', function (e) {
                    var btn = e.target.closest && e.target.closest('.vas-button');
                    if (!btn) return;
                    var key = e.key;
                    var current = Number(btn.getAttribute('data-value')) || 1;
                    var next = current;
                    if (key === 'ArrowLeft' || key === 'ArrowUp') {
                        next = current - 1; if (next < 1) next = 10;
                    } else if (key === 'ArrowRight' || key === 'ArrowDown') {
                        next = current + 1; if (next > 10) next = 1;
                    } else if (key === 'Home') {
                        next = 1;
                    } else if (key === 'End') {
                        next = 10;
                    } else if (key === 'Enter' || key === ' ') {
                        // Activate current button
                        var alpineRoot = root.__x || (root._x_dataStack && root._x_dataStack[0]);
                        var data = alpineRoot && (alpineRoot.$data || alpineRoot);
                        if (data) {
                            data.pg_scale = Number(btn.getAttribute('data-value')) || data.pg_scale;
                            if (typeof data.calculateDAS28 === 'function') data.calculateDAS28();
                            if (window._markDirty) window._markDirty();
                        }
                        e.preventDefault();
                        return;
                    } else return;

                    // set next value on Alpine data
                    var alpineRoot = root.__x || (root._x_dataStack && root._x_dataStack[0]);
                    var data = alpineRoot && (alpineRoot.$data || alpineRoot);
                    if (data) {
                        data.pg_scale = next;
                        if (typeof data.calculateDAS28 === 'function') data.calculateDAS28();
                        if (window._markDirty) window._markDirty();
                    }
                    var nextBtn = container.querySelector('.vas-button[data-value="' + next + '"]');
                    if (nextBtn) nextBtn.focus();
                    e.preventDefault();
                });
            } catch (e) { console.warn('VAS keyboard delegation setup failed', e); }
        });
    })();
</script>
