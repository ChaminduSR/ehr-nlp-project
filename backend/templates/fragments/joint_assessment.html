<div class="joint-map-fragment" x-data="jointAssessment()" x-init="init()">
    <div class="panel-header">
        <h3>Joint Assessment</h3>
        <span class="save-status" x-text="saveStatus"></span>
    </div>

    <div class="grid" style="grid-template-columns: 420px 1fr; gap: 1rem; align-items: start;">
        <!-- Left Column: Joint Map -->
        <article class="joint-card" style="padding: 1rem; margin: 0;">
            <header style="margin-bottom: 1rem;">Joint Map</header>
            <div id="joint-canvas" class="joint-map-canvas"
                style="width: 100%; height: 600px; background: #f8fafc; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius);">
            </div>

            <!-- Legend -->
            <footer class="grid">
                <div><span
                        style="display:inline-block;width:12px;height:12px;background:white;border:1px solid #333;"></span>
                    Normal</div>
                <div><span
                        style="display:inline-block;width:12px;height:12px;background:#FFEB3B;border:1px solid #333;"></span>
                    Tenderness</div>
                <div><span
                        style="display:inline-block;width:12px;height:12px;background:#FF4444;border:1px solid #333;"></span>
                    Swelling</div>
                <div><span
                        style="display:inline-block;width:12px;height:12px;background:#FF8C00;border:1px solid #333;"></span>
                    Both</div>
                <div><span
                        style="display:inline-block;width:12px;height:12px;background:white;border:2px solid #2196F3;"></span>
                    Pain
                    (Right Click)</div>
            </footer>
        </article>

        <!-- Right Column: DAS28 Score & Controls -->
        <article style="padding: 1rem; margin: 0;">
            <header style="margin-bottom: 1rem;">DAS28 Score</header>
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label>Tender Joints (TJC)</label>
                    <input type="number" x-model="tjc" readonly>
                </div>
                <div>
                    <label>Swollen Joints (SJC)</label>
                    <input type="number" x-model="sjc" readonly>
                </div>
                <div>
                    <label>ESR (mm/h)</label>
                    <input type="number" x-model.number="esr" @input="calculateDAS28()">
                </div>
                <div>
                    <label>Patient Global (0-100)</label>
                    <input type="number" x-model.number="pga" @input="calculateDAS28()">
                </div>
            </div>

            <hr style="margin: 1.5rem 0;">

            <div class="das28-card" style="border: none; padding: 0; background: transparent; box-shadow: none;">
                <h3>Score: <span x-text="score" style="color: var(--pico-primary);"></span></h3>
                <progress :value="score" max="10" style="margin-bottom: 0.5rem;"></progress>
                <p style="font-weight: bold;">
                    <small x-show="score < 2.6" class="remission">Remission</small>
                    <small x-show="score >= 2.6 && score <= 3.2" class="low">Low Activity</small>
                    <small x-show="score > 3.2 && score <= 5.1" class="moderate">Moderate Activity</small>
                    <small x-show="score > 5.1" class="high">High Activity</small>
                </p>
            </div>

            <button class="contrast" @click="saveAssessment()" style="width: 100%; margin-top: 1rem;">Save
                Assessment</button>
        </article>
    </div>

    <div id="joint-tooltip" class="joint-tooltip" x-show="hoveredJoint"
        :style="`left: ${tooltipX}px; top: ${tooltipY}px; position: fixed; z-index: 1000; background: white; color: black; padding: 5px; border: 1px solid black; pointer-events: none;`"
        x-cloak>
        <span x-text="hoveredJoint && hoveredJoint.label"></span>
    </div>
</div>
